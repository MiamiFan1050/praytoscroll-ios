name: CI (build, test, screenshots)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_tests:
        description: >-
          Cheap re-run: space-separated UI tests (Class or Class/testMethod in PrayToScrollUITests). Runs just those;
          skips unit tests, screenshots, the release check, video and crawl. Empty = the full CI.
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen >/dev/null
          xcodebuild -version
          mkdir -p out

      - name: Generate project
        run: cd app && xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(bash ci/pick_sim.sh)
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build + unit tests
        if: ${{ !inputs.only_tests }}
        run: |
          set -o pipefail
          cd app
          xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScrollUnit \
            -destination "id=$SIM" -derivedDataPath ../build \
            -resultBundlePath ../out/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../out/unit.log | grep -E "error:|warning: .*(deprecated|unused)|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" ../out/unit.log

      - name: UI tests + screenshots
        if: always()
        env:
          ONLY_TESTS: ${{ inputs.only_tests }}
        run: |
          set -o pipefail
          cd app
          xcrun simctl status_bar "$SIM" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          SELECT=(-skip-testing:PrayToScrollUITests/CrawlTests -skip-testing:PrayToScrollUITests/TapThroughTests)
          if [ -n "$ONLY_TESTS" ]; then
            SELECT=()
            for t in $ONLY_TESTS; do
              [[ "$t" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+)?$ ]] || { echo "bad test name: $t"; exit 1; }
              SELECT+=("-only-testing:PrayToScrollUITests/$t")
            done
          fi
          xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScrollScreenshots \
            -destination "id=$SIM" -derivedDataPath ../build \
            -resultBundlePath ../out/ui.xcresult \
            "${SELECT[@]}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../out/ui.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" ../out/ui.log

      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p out/screenshots
          if [ -d out/ui.xcresult ]; then
            xcrun xcresulttool export attachments --path out/ui.xcresult --output-path out/screenshots 2>/dev/null || true
          fi
          ls -la out/screenshots | head -60

      - name: Release-config compile check (device, unsigned)
        if: ${{ always() && !inputs.only_tests }}
        run: |
          set -o pipefail
          cd app
          xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScroll -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath ../build-release \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../out/release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" ../out/release.log
          # App Store requires a privacy manifest (UserDefaults is a required-reason API) in the app, the widget and
          # the three Screen Time extensions.
          find ../build-release/Build/Products -name PrivacyInfo.xcprivacy -path "*.app/*" | tee ../out/privacy-manifests.txt
          [ "$(grep -c . ../out/privacy-manifests.txt)" -ge 5 ]
          # No dormant code in the Release binary (guideline 2.5.19): no demo/mock/StoreKit types, no StoreKit link.
          APPDIR=$(find ../build-release/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          BIN="$APPDIR/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPDIR/Info.plist")"
          strings -a "$BIN" > ../out/release-strings.txt
          grep -q CloudKitCircleService ../out/release-strings.txt   # control: the scan does see Swift type names
          { grep -E "DemoSeeder|MockCircleService|DemoLock|ProStore|com\.amenkeyapp\.ios\.demo" ../out/release-strings.txt || true; } | sort -u > ../out/release-dormant.txt
          { otool -L "$BIN" | grep -i storekit || true; } >> ../out/release-dormant.txt
          cat ../out/release-dormant.txt
          [ ! -s ../out/release-dormant.txt ]
          echo "Release binary: no demo, mock or StoreKit code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out
          path: |
            out/*.log
            out/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # The 60-90 s walk-through video, on its own runner so it always uploads.
  video:
    if: ${{ !inputs.only_tests }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools + project + simulator
        run: |
          brew install xcodegen >/dev/null
          mkdir -p out/qa
          cd app && xcodegen generate && cd ..
          UDID=$(bash ci/pick_sim.sh)
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Tap-through video
        run: |
          set -o pipefail
          QA="$GITHUB_WORKSPACE/out/qa"
          rm -f "$QA/rec.start" "$QA/rec.ready" "$QA/rec.stop"
          # The test writes rec.start / rec.stop, so the video holds only the walk-through. rec.ready tells the test
          # the recorder is really running (it takes a few seconds), so the video opens on Home.
          (
            for i in $(seq 1 3000); do [ -f "$QA/rec.start" ] && break; sleep 0.2; done
            xcrun simctl io "$SIM" recordVideo --codec=h264 --force "$QA/tapthrough.mp4" > "$GITHUB_WORKSPACE/out/recorder.log" 2>&1 &
            REC=$!
            for i in $(seq 1 150); do grep -q "Recording started" "$GITHUB_WORKSPACE/out/recorder.log" 2>/dev/null && break; sleep 0.2; done
            touch "$QA/rec.ready"
            for i in $(seq 1 1500); do [ -f "$QA/rec.stop" ] && break; sleep 0.2; done
            kill -INT "$REC"
            wait "$REC" || true
          ) &
          WATCH=$!
          cd app
          TEST_RUNNER_QA_DIR="$QA" xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScrollScreenshots \
            -destination "id=$SIM" -derivedDataPath ../build \
            -resultBundlePath ../out/tapthrough.xcresult \
            -only-testing:PrayToScrollUITests/TapThroughTests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../out/tapthrough.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" || true
          touch "$QA/rec.start" "$QA/rec.stop"
          wait "$WATCH" || true
          cat ../out/recorder.log || true
          ls -la "$QA"
          grep -q "\*\* TEST SUCCEEDED \*\*" ../out/tapthrough.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-video
          path: |
            out/qa/tapthrough.mp4
            out/tapthrough.log
          if-no-files-found: ignore
          retention-days: 14

  # The crawler in two halves on parallel runners (each screen has a tap + time budget).
  crawl:
    if: ${{ !inputs.only_tests }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: a
            tests: test01Today test02Scroll test03People test04Together test05Progress test06Answered test07Circle test08Journal test09Settings test10GateSetup test11GateVerified test12Troubleshoot
          - part: b
            tests: test13GuidedPrayer test14GatePrayer test16PrayForSomeone test17ChoosePerson test18AddPerson test19PersonDetail test20NewCircle test21JoinCircle test22SavedVerses test23GateGuide test24EmergencyPass test25OnboardingWalk
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools + project + simulator
        run: |
          brew install xcodegen >/dev/null
          mkdir -p out/qa
          cd app && xcodegen generate && cd ..
          UDID=$(bash ci/pick_sim.sh)
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: QA crawl (part ${{ matrix.part }})
        run: |
          set -o pipefail
          ONLY=""
          for t in ${{ matrix.tests }}; do ONLY="$ONLY -only-testing:PrayToScrollUITests/CrawlTests/$t"; done
          cd app
          TEST_RUNNER_QA_DIR="$GITHUB_WORKSPACE/out/qa" xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScrollScreenshots \
            -destination "id=$SIM" -derivedDataPath ../build \
            -resultBundlePath ../out/crawl.xcresult $ONLY \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../out/crawl-${{ matrix.part }}.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" || true
          cd ..
          python3 app/tools/qa_crawl_report.py out/qa out/crawl.xcresult
          grep -q "\*\* TEST SUCCEEDED \*\*" out/crawl-${{ matrix.part }}.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-crawl-${{ matrix.part }}
          path: |
            out/qa/crawl-*.md
            out/crawl-*.log
          if-no-files-found: ignore
          retention-days: 14

  crawl-report:
    needs: crawl
    if: ${{ always() && !inputs.only_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-crawl-*
          merge-multiple: true
          path: out/qa-parts
      - name: Merge crawl logs
        run: |
          mkdir -p out/qa
          cp out/qa-parts/crawl-[0-9][0-9]-*.md out/qa/ 2>/dev/null || true
          python3 app/tools/qa_crawl_report.py out/qa
          head -5 out/qa/crawl.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-crawl
          path: out/qa/crawl.md
          if-no-files-found: ignore
          retention-days: 14
