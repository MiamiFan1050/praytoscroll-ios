name: Release (archive, sign, upload to App Store Connect)
on:
  workflow_dispatch:
    inputs:
      strict_lock:
        # v1.2: the Screen Time lock build (app/project-strictlock.yml: STRICT_LOCK, version 1.2, the widget plus 3
        # Screen Time extensions). Only once Apple has approved Family Controls (Distribution) and the 4 FC_*
        # profile secrets exist (app/RELEASE-1.2.md). Untick for the plain Shortcuts-gate build (project.yml).
        description: "Strict Lock (Screen Time) build, 1.2"
        type: boolean
        default: true

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      STRICT_LOCK: ${{ inputs.strict_lock }}
    steps:
      - uses: actions/checkout@v4

      # Fails in seconds, before any build minutes, when a Family Controls profile secret is missing (names only).
      - name: Check the Strict Lock signing secrets
        if: inputs.strict_lock
        env:
          FC_APP_PROFILE_B64: ${{ secrets.FC_APP_PROFILE_B64 }}
          FC_SHIELDCONFIG_PROFILE_B64: ${{ secrets.FC_SHIELDCONFIG_PROFILE_B64 }}
          FC_SHIELDACTION_PROFILE_B64: ${{ secrets.FC_SHIELDACTION_PROFILE_B64 }}
          FC_MONITOR_PROFILE_B64: ${{ secrets.FC_MONITOR_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.WIDGET_PROFILE_B64 }}
        run: |
          missing=""
          for V in FC_APP_PROFILE_B64 FC_SHIELDCONFIG_PROFILE_B64 FC_SHIELDACTION_PROFILE_B64 FC_MONITOR_PROFILE_B64 WIDGET_PROFILE_B64; do
            [ -n "${!V}" ] || missing="$missing $V"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see app/RELEASE-1.2.md)"; exit 1; fi
          echo "All 5 profile secrets are set"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen >/dev/null
          xcodebuild -version
          mkdir -p out

      - name: Generate project + set build number
        run: |
          cd app
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep -n CURRENT_PROJECT_VERSION project.yml
          if [ "$STRICT_LOCK" = "true" ]; then
            xcodegen generate --spec project-strictlock.yml   # includes project.yml (and its build number)
          else
            xcodegen generate
          fi

      - name: Install signing certificate, profiles and API key
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.APP_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.WIDGET_PROFILE_B64 }}
          FC_APP_PROFILE_B64: ${{ secrets.FC_APP_PROFILE_B64 }}
          FC_SHIELDCONFIG_PROFILE_B64: ${{ secrets.FC_SHIELDCONFIG_PROFILE_B64 }}
          FC_SHIELDACTION_PROFILE_B64: ${{ secrets.FC_SHIELDACTION_PROFILE_B64 }}
          FC_MONITOR_PROFILE_B64: ${{ secrets.FC_MONITOR_PROFILE_B64 }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          echo "$DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -v -p codesigning "$KEYCHAIN"
          # The Strict Lock build signs 5 bundles: the app and the 3 Screen Time extensions with Family Controls
          # (Distribution) profiles, the widget with its existing one. The default build signs the app and the widget.
          if [ "$STRICT_LOCK" = "true" ]; then
            PROFILES="FC_APP:com.amenkeyapp.ios:fc WIDGET:com.amenkeyapp.ios.widget:- FC_SHIELDCONFIG:com.amenkeyapp.ios.shieldconfig:fc FC_SHIELDACTION:com.amenkeyapp.ios.shieldaction:fc FC_MONITOR:com.amenkeyapp.ios.monitor:fc"
          else
            PROFILES="APP:com.amenkeyapp.ios:- WIDGET:com.amenkeyapp.ios.widget:-"
          fi
          for E in $PROFILES; do
            P=${E%%:*}; REST=${E#*:}; BUNDLE=${REST%%:*}; NEEDS=${REST#*:}
            V="${P}_PROFILE_B64"
            echo "${!V}" | base64 --decode > "$RUNNER_TEMP/$P.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$P.mobileprovision" > "$RUNNER_TEMP/$P.plist"
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/$P.plist")
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/$P.plist")
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/$P.plist")
            FC=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.family-controls" "$RUNNER_TEMP/$P.plist" 2>/dev/null || echo "none")
            echo "$P: \"$NAME\" for $APPID, family-controls: $FC"
            case "$APPID" in *".$BUNDLE") ;; *) echo "::error::$V is a profile for $APPID, not $BUNDLE"; exit 1 ;; esac
            if [ "$NEEDS" = "fc" ] && [ "$FC" != "true" ]; then
              echo "::error::$V has no Family Controls entitlement: regenerate it after Apple's approval (app/RELEASE-1.2.md)"; exit 1
            fi
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d"; cp "$RUNNER_TEMP/$P.mobileprovision" "$d/$UUID.mobileprovision"
            done
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        run: |
          set -o pipefail
          cd app
          xcodebuild -project PrayToScroll.xcodeproj -scheme PrayToScroll -configuration Release \
            -destination "generic/platform=iOS" -archivePath ../out/PrayToScroll.xcarchive \
            archive 2>&1 | tee ../out/archive.log | grep -E "error:|Signing Identity|Provisioning Profile|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" ../out/archive.log

      # The archive is the build that was asked for: version, extensions and the Family Controls entitlement.
      - name: Check the archive
        run: |
          set -euo pipefail
          APPDIR=$(find out/PrayToScroll.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -1)
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APPDIR/Info.plist")
          ls "$APPDIR/PlugIns" | sort | tee out/plugins.txt
          codesign -d --entitlements - --xml "$APPDIR" 2>/dev/null > out/app-entitlements.plist || true
          echo "version $VERSION"
          if [ "$STRICT_LOCK" = "true" ]; then
            [ "$VERSION" = "1.2" ]
            printf '%s\n' PrayToScrollMonitor.appex PrayToScrollShieldAction.appex PrayToScrollShieldConfig.appex PrayToScrollWidget.appex | diff - out/plugins.txt
            grep -q "com.apple.developer.family-controls" out/app-entitlements.plist
            for X in PrayToScrollMonitor PrayToScrollShieldAction PrayToScrollShieldConfig; do
              codesign -d --entitlements - --xml "$APPDIR/PlugIns/$X.appex" 2>/dev/null | grep -q "com.apple.developer.family-controls" \
                || { echo "::error::$X.appex is signed without Family Controls"; exit 1; }
            done
            echo "Strict Lock archive: 1.2, 4 extensions, Family Controls on the app and the 3 Screen Time extensions"
          else
            [ "$(cat out/plugins.txt)" = "PrayToScrollWidget.appex" ]
            ! grep -q "family-controls" out/app-entitlements.plist
            echo "Default archive: version $VERSION, widget only, no Family Controls"
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          OPTIONS=ci/ExportOptions.plist
          [ "$STRICT_LOCK" = "true" ] && OPTIONS=ci/ExportOptions-strictlock.plist
          echo "export options: $OPTIONS"
          xcodebuild -exportArchive -archivePath out/PrayToScroll.xcarchive \
            -exportOptionsPlist "$OPTIONS" -exportPath out/ipa 2>&1 | tee out/export.log | tail -20
          ls -la out/ipa

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          IPA=$(ls out/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal 2>&1 | tee out/upload.log | tail -30
          ! grep -qiE "ERROR ITMS|Failed to upload|error:" out/upload.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-out
          path: |
            out/*.log
            out/plugins.txt
            out/ipa/*.plist
          if-no-files-found: ignore
          retention-days: 14
