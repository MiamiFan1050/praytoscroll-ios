# Pray to Scroll: XcodeGen spec (v1.1: Screen Time lock + the Shortcuts gate as its fallback).
#   xcodegen generate -> PrayToScroll.xcodeproj
# Release signing needs App Store profiles WITH the Family Controls (Distribution) capability for the app and its
# three Screen Time extensions (Apple request S7N7QC6BD5): see the PROVISIONING_PROFILE_SPECIFIER names below.
name: PrayToScroll
options:
  bundleIdPrefix: com.amenkeyapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ZV8C94YFWU
    CODE_SIGN_STYLE: Manual
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    PROVISIONING_PROFILE_SPECIFIER: ""
    # The app's name lives here (Info.plist CFBundleDisplayName) and is read at runtime by AppConstants.appName.
    APP_DISPLAY_NAME: "Pray to Scroll"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  PrayToScroll:
    type: application
    platform: iOS
    sources:
      - path: PrayToScroll
        excludes:
          # StoreKit "Pro" scaffolding for a later version: kept in the repo, out of the v1.0 binary (guideline 2.5.19).
          - "Services/ProStore.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: PrayToScroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AmenKey AppStore"
    info:
      path: PrayToScroll/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Save your prayer cards and milestone badges to Photos.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.amenkeyapp.ios
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - prayscroll
              - amenkey
        LSApplicationQueriesSchemes:
          - instagram
          - snssdk1233
          - tiktok
          - youtube
          - twitter
          - x
          - snapchat
          - fb
          - reddit
          - barcelona
          - pinterest
          - shortcuts
          - sms
        AKWebBase: https://praytoscroll.vercel.app
        AKAppStoreID: ""
    entitlements:
      path: PrayToScroll/PrayToScroll.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amenkeyapp.ios
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.amenkeyapp.ios
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.family-controls: true
    dependencies:
      - target: PrayToScrollWidget
        embed: true
        codeSign: true
      - target: PrayToScrollShieldConfig
        embed: true
        codeSign: true
      - target: PrayToScrollShieldAction
        embed: true
        codeSign: true
      - target: PrayToScrollMonitor
        embed: true
        codeSign: true

  PrayToScrollWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayToScrollWidget
      - path: Shared
        excludes:
          - "StrictLockStore.swift"   # Screen Time stays out of the widget
      - path: PrayToScroll/Resources/verses.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: PrayToScrollWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AmenKey Widget AppStore"
    info:
      path: PrayToScrollWidget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PrayToScrollWidget/PrayToScrollWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amenkeyapp.ios

  # Screen Time (Strict Lock) extensions: the shield's look, its buttons, and the relock when a window ends.
  PrayToScrollShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: StrictLock/ShieldConfiguration
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.shieldconfig
        PRODUCT_NAME: PrayToScrollShieldConfig
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AmenKey ShieldConfig AppStore"
    info:
      path: StrictLock/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Pray to Scroll Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: StrictLock/ShieldConfiguration/ShieldConfig.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amenkeyapp.ios
        com.apple.developer.family-controls: true

  PrayToScrollShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: StrictLock/ShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.shieldaction
        PRODUCT_NAME: PrayToScrollShieldAction
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AmenKey ShieldAction AppStore"
    info:
      path: StrictLock/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Pray to Scroll Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: StrictLock/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amenkeyapp.ios
        com.apple.developer.family-controls: true

  PrayToScrollMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: StrictLock/DeviceActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.monitor
        PRODUCT_NAME: PrayToScrollMonitor
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AmenKey Monitor AppStore"
    info:
      path: StrictLock/DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Pray to Scroll Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: StrictLock/DeviceActivityMonitor/Monitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amenkeyapp.ios
        com.apple.developer.family-controls: true

  PrayToScrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrayToScrollTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PrayToScroll.app/PrayToScroll
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PrayToScroll

  PrayToScrollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrayToScrollUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amenkeyapp.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PrayToScroll
    dependencies:
      - target: PrayToScroll

schemes:
  PrayToScroll:
    build:
      targets:
        PrayToScroll: all
        PrayToScrollWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PrayToScrollTests
        - PrayToScrollUITests
    archive:
      config: Release
  PrayToScrollUnit:
    build:
      targets:
        PrayToScroll: all
    test:
      config: Debug
      targets:
        - PrayToScrollTests
  PrayToScrollScreenshots:
    build:
      targets:
        PrayToScroll: all
    test:
      config: Debug
      targets:
        - PrayToScrollUITests
